name: Billora ERP CI Quality & Security Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./prisma/dev.db"
      AUTH_SECRET: "ci-quality-gate-secret-key-2026-minimum-32-characters"
      NODE_ENV: "production"
      APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_NAME: "Billora"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Environment Variables
        run: |
          cp .env.example .env
          echo "DATABASE_URL=file:./prisma/dev.db" >> .env
          echo "AUTH_SECRET=ci-quality-gate-secret-key-2026-minimum-32-characters" >> .env

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Push SQLite Schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Suite
        run: npm test
        env:
          NODE_ENV: "test"

      - name: Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: "production"
